name: Zed adapter acceptance

on:
  pull_request:
    paths: ['editors/zed/**', '.github/workflows/zed*.yml']
  push:
    branches: [main]
    paths: ['editors/zed/**', '.github/workflows/zed*.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Optional exact adapter version for a tagged release
        type: string
        default: ''
    outputs:
      version:
        description: Independently versioned Zed adapter
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust installer behavior (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target wasm32-wasip2
      - name: Check formatting and actual installer tests
        run: |
          mkdir -p ../../artifacts/zed-rust
          cargo fmt --all -- --check
          cargo test --locked 2>&1 | tee ../../artifacts/zed-rust/tests.log
      - name: Retain Rust evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: zed-argocd-zed-rust-${{ matrix.runner }}
          path: artifacts/zed-rust/
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Standalone WASM package and ablations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Validate the independent adapter version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          resolved=$(python package.py)
          printf '%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED_VERSION" && "$resolved" != "version=$REQUESTED_VERSION" ]]; then
            echo 'Requested adapter version differs from its manifest.' >&2
            exit 1
          fi
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip2
      - name: Build the standalone WASM component
        run: cargo build --locked --release --target wasm32-wasip2
      - name: Exercise real package creation, extraction, notices and refusals
        run: python tests/package_e2e.py --wasm target/wasm32-wasip2/release/zed_argocd.wasm --output ../../artifacts/zed/package-e2e
      - name: Prove independence and detect removed package guards
        run: python tests/ablate_distribution.py --output ../../artifacts/zed/distribution-ablation
      - name: Exercise the real identity probe process
        run: |
          cargo build --locked --offline --example identity_probe
          python tests/adapter_e2e.py target/debug/examples/identity_probe ../../artifacts/zed/identity-probe
      - name: Detect compiling identity guard removals
        run: python tests/ablate_identity.py --output ../../artifacts/zed/identity-ablation
      - name: Package the exact clean adapter source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python package.py --wasm target/wasm32-wasip2/release/zed_argocd.wasm --output ../../artifacts/zed-release --source-commit "$SOURCE_COMMIT"
      - name: Retain the verified installable adapter
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: zed-argocd-zed-adapter-${{ github.sha }}
          path: artifacts/zed-release/
          if-no-files-found: error
          retention-days: 30
      - name: Retain successful and failed package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: zed-argocd-zed-package-evidence
          path: artifacts/zed/
          if-no-files-found: ignore
          retention-days: 30

  acceptance:
    name: Zed acceptance gate
    if: always()
    needs: [rust, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every independent adapter check
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$RUST_RESULT" = success && test "$PACKAGE_RESULT" = success
