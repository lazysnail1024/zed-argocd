name: Published Zed adapter file-install acceptance
permissions:
  contents: read
jobs:
  source:
    name: Validate successful publication identity
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.identity.outputs.source }}
      execute: ${{ steps.identity.outputs.execute }}
    steps:
    - name: Read trusted upstream metadata before checkout
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: "python - <<'PY_IDENTITY'\nimport json, os, subprocess\nfrom pathlib import Path\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())\ndef api(path):return\
        \ json.loads(subprocess.check_output(['gh','api',path]))\nrepository=os.environ['GITHUB_REPOSITORY']\nif os.environ['GITHUB_EVENT_NAME']=='workflow_run':\n    upstream=event['workflow_run']\n\
        \    run=api('/repos/'+repository+'/actions/runs/'+str(upstream['id'])+'/attempts/'+str(upstream['run_attempt']))\n    workflow=api('/repos/'+repository+'/actions/workflows/'+str(run['workflow_id']))\n\
        \    assert run['repository']['full_name']==repository and run['head_repository']['full_name']==repository\n    assert workflow['path']=='.github/workflows/zed-release.yml' and\
        \ workflow['name']=='Release independent Zed adapter'\n    assert run['event'] in ('push','workflow_dispatch') and run['head_sha']==upstream['head_sha']\n    assert run['id']==upstream['id']\
        \ and run['run_attempt']==upstream['run_attempt']\n    execute=run['conclusion']=='success'\n    source=run['head_sha']\nelse:\n    execute=True\n    source=os.environ['GITHUB_SHA']\n\
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:\n    output.write('source='+source+'\\nexecute='+str(execute).lower()+'\\n')\nif not execute:\n    with open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as output:output.write('Publication failed or was cancelled; installation was not executed.\\n')\nPY_IDENTITY"
  install:
    if: needs.source.outputs.execute == 'true'
    name: Real Release file-install E2E (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - macos-15
        - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.source.outputs.source }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Install, upgrade, roll back and fault-inject using public Release assets
      shell: bash
      run: python editors/zed/tests/install_e2e.py --report artifacts/zed-installer --source-commit "${{ needs.source.outputs.source }}"
    - name: Retain file-install evidence (not a Zed GUI test)
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: zed-installer-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/zed-installer/
        if-no-files-found: error
        retention-days: 30
    needs: source
  acceptance:
    name: Published installation result-${{ github.run_id }}-${{ github.run_attempt }}
    if: always()
    needs:
    - source
    - install
    runs-on: ubuntu-24.04
    steps:
    - name: Reject skipped installation after successful publication
      env:
        SOURCE_RESULT: ${{ needs.source.result }}
        EXECUTE: ${{ needs.source.outputs.execute }}
        INSTALL_RESULT: ${{ needs.install.result }}
      run: "test \"$SOURCE_RESULT\" = success\nif [ \"$EXECUTE\" = true ]; then\n  test \"$INSTALL_RESULT\" = success\nelse\n  test \"$INSTALL_RESULT\" = skipped\n  echo 'Publication\
        \ failed or was cancelled; installation not executed.' >> \"$GITHUB_STEP_SUMMARY\"\nfi"
'on':
  workflow_run:
    workflows:
    - Release independent Zed adapter
    types:
    - completed
  workflow_dispatch: null
