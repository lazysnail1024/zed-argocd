name: Release independent Zed adapter
'on':
  push:
    tags:
    - zed-v*
    branches:
    - main
    paths:
    - editors/zed/extension.toml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: zed-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Resolve the exact clean adapter version and release tag
      id: version
      env:
        RELEASE_REF: ${{ github.ref }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" || -n "$(git status --porcelain --untracked-files=all)" ]]; then
          echo 'Adapter release requires this exact clean committed source.' >&2
          exit 1
        fi
        resolved=$(python editors/zed/package.py)
        tag="zed-v${resolved#version=}"
        case "$RELEASE_REF" in
          refs/heads/main|"refs/tags/$tag") ;;
          *) echo 'Release must run on main or its exact version tag.' >&2; exit 1 ;;
        esac
        printf '%s\n' "$resolved" "tag=$tag" >> "$GITHUB_OUTPUT"
  adapter:
    needs: version
    uses: ./.github/workflows/zed.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
  publish:
    needs:
    - version
    - adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Wait for the exact published native release and all platform assets
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_API_URL: ${{ github.api_url }}
        NATIVE_BINARY: argocd-ls
      run: |
        python - <<'PY_NATIVE'
        import json, os, runpy, time, urllib.error, urllib.parse, urllib.request

        # Read the independently pinned native version without invoking Go or Rust.
        _, _, native = runpy.run_path('editors/zed/package.py')['identity']()
        tag = 'v' + native
        url = (os.environ['RELEASE_API_URL'] + '/repos/' + os.environ['GH_REPO']
               + '/releases/tags/' + urllib.parse.quote(tag, safe=''))
        headers = {'Accept': 'application/vnd.github+json',
                   'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                   'X-GitHub-Api-Version': '2022-11-28'}
        platforms = ['linux-amd64', 'linux-arm64', 'darwin-amd64', 'darwin-arm64', 'windows-amd64']
        required = {'SHA256SUMS'} | {
            os.environ['NATIVE_BINARY'] + '-' + native + '-' + platform
            + ('.exe' if platform.startswith('windows-') else '') for platform in platforms}
        deadline = time.monotonic() + 45 * 60
        while True:
            remaining = deadline - time.monotonic()
            if remaining <= 0:
                raise SystemExit(f'Timed out waiting 45 minutes for the published native release {tag}')
            try:
                request = urllib.request.Request(url, headers=headers)
                with urllib.request.urlopen(request, timeout=min(30, remaining)) as response:
                    release = json.load(response)
            except urllib.error.HTTPError as error:
                if error.code != 404:
                    raise SystemExit(f'Native release lookup failed: HTTP {error.code}') from None
                release = None
            if release is not None:
                if release.get('tag_name') != tag:
                    raise SystemExit('Native release tag differs from the exact adapter pin')
                if release.get('draft') is not True:
                    if release.get('draft') is not False or not release.get('published_at'):
                        raise SystemExit('Native release has invalid publication metadata')
                    assets = release.get('assets', [])
                    for name in sorted(required):
                        matches = [asset for asset in assets if asset.get('name') == name]
                        if (len(matches) != 1 or matches[0].get('state') != 'uploaded'
                                or not isinstance(matches[0].get('size'), int) or matches[0]['size'] <= 0):
                            raise SystemExit('Published native release lacks a complete required asset: ' + name)
                    print(f'Native {tag} is published with all five platform executables and SHA256SUMS')
                    break
            remaining = deadline - time.monotonic()
            if remaining <= 0:
                raise SystemExit(f'Timed out waiting 45 minutes for the published native release {tag}')
            print(f'Waiting for native {tag}: release is missing or still a draft; {int(remaining)} seconds remain', flush=True)
            time.sleep(min(30, remaining))
        PY_NATIVE
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: zed-argocd-zed-adapter-${{ github.sha }}
        path: artifacts/zed-release
    - name: Recheck the exact source, version and downloaded bytes
      env:
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        record = json.loads(Path('artifacts/zed-release/zed-adapter.json').read_bytes())
        if record['version'] != os.environ['RELEASE_VERSION'] or record['sourceCommit'] != os.environ['SOURCE_COMMIT']:
            raise SystemExit('Adapter artifacts do not match this version and commit')
        if record['kind'] != 'zed-adapter' or record['extensionId'] != 'argocd-lsp' or record['target'] != 'wasm32-wasip2':
            raise SystemExit('Unexpected adapter artifact identity')
        PY
        cd artifacts/zed-release
        sha256sum --check SHA256SUMS
    - name: Create the exact tag and publish an immutable adapter release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_API_URL: ${{ github.api_url }}
        RELEASE_COMMIT: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.version.outputs.tag }}
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
      run: |
        python - <<'PY_TAG'
        import json, os, re, urllib.error, urllib.parse, urllib.request

        commit = os.environ['RELEASE_COMMIT']
        tag = os.environ['RELEASE_TAG']
        if not re.fullmatch('[0-9a-f]{40}', commit):
            raise SystemExit('Release requires an exact commit SHA')
        base = os.environ['RELEASE_API_URL'] + '/repos/' + os.environ['GH_REPO']
        headers = {'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                   'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                   'X-GitHub-Api-Version': '2022-11-28'}

        def api(path, payload=None, absent_ok=False):
            data = None if payload is None else json.dumps(payload).encode()
            request = urllib.request.Request(base + path, data=data, headers=headers,
                                             method='GET' if payload is None else 'POST')
            try:
                with urllib.request.urlopen(request, timeout=60) as response:
                    return json.load(response)
            except urllib.error.HTTPError as error:
                if payload is None and absent_ok and error.code == 404:
                    return None
                raise SystemExit(f'GitHub {request.get_method()} {path} failed: HTTP {error.code}') from None

        # Listing with contents:write also includes drafts; never replace either kind.
        page = 1
        while True:
            releases = api(f'/releases?per_page=100&page={page}')
            if any(release['tag_name'] == tag for release in releases):
                raise SystemExit('This release already exists, including any draft; published pins must not be overwritten')
            if len(releases) < 100:
                break
            page += 1

        path = '/git/ref/tags/' + urllib.parse.quote(tag, safe='')
        if api(path, absent_ok=True) is None:
            api('/git/refs', {'ref': 'refs/tags/' + tag, 'sha': commit})
        reference = api(path)
        if reference['ref'] != 'refs/tags/' + tag:
            raise SystemExit('GitHub returned a different tag reference')
        obj = reference['object']
        for _ in range(16):
            if obj['type'] != 'tag':
                break
            obj = api('/git/tags/' + obj['sha'])['object']
        if obj['type'] != 'commit' or obj['sha'] != commit:
            raise SystemExit('Existing tag does not resolve to this exact verified commit')
        print(f'Verified {tag} at {commit}; existing tags were not modified')
        PY_TAG
        flags=()
        if [[ "$RELEASE_VERSION" == *-* ]]; then
          flags+=(--prerelease)
        fi
        gh release create "$RELEASE_TAG" artifacts/zed-release/* --verify-tag --target "$RELEASE_COMMIT" --draft --latest=false "${flags[@]}" --title "Argo CD Zed adapter $RELEASE_VERSION" --notes 'Precompiled Zed adapter with original Rust dependency notices and SHA256SUMS. This editor release is independent of the native LSP. Follow the README installation instructions; the adapter downloads its pinned native server when needed. This release does not publish to the Zed extension store. Rust installer and package tests have passed; a real Zed GUI session is not claimed by this workflow.'
        gh release edit "$RELEASE_TAG" --draft=false --latest=false
