name: Native LSP acceptance and distribution
permissions:
  contents: read
jobs:
  prepare:
    name: Resolve exact candidate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Validate the independent LSP VERSION and clean source
      id: version
      env:
        REQUESTED_VERSION: ${{ inputs.release_version }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: python tools/release.py version --source-commit "$SOURCE_COMMIT" --requested-version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          platform: linux/amd64
          artifact: linux-amd64
          bundle: linux-amd64
          cc: gcc-13
          compiler: 13.3.0
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          artifact: linux-arm64
          bundle: linux-arm64
          cc: gcc-13
          compiler: 13.3.0
        - runner: macos-15-intel
          platform: darwin/amd64
          artifact: macos-amd64
          bundle: darwin-amd64
          cc: clang
          compiler: Apple clang version 17.0.0
        - runner: macos-15
          platform: darwin/arm64
          artifact: macos-arm64
          bundle: darwin-arm64
          cc: clang
          compiler: Apple clang version 17.0.0
        - runner: windows-2025
          platform: windows/amd64
          artifact: windows-amd64
          bundle: windows-amd64
          cc: gcc
          compiler: 15.2.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Build, package and execute actual native consumers
      run: python tests/native_ci.py --platform "${{ matrix.platform }}" --source-commit "${{ github.sha }}" --compiler-version "${{ matrix.compiler }}" --release-version "${{ needs.prepare.outputs.version }}"
    - name: Test release staging and complete-platform aggregation
      run: python tests/release_e2e.py --platform "${{ matrix.platform }}" --output artifacts/native-ci/release-e2e
    - name: Prove native release works without any editor checkout
      if: matrix.platform == 'linux/amd64'
      run: python tests/native_isolation.py --output artifacts/native-isolation
    - name: Verify compatibility mechanisms by isolated removal
      if: matrix.platform == 'linux/amd64'
      run: python tests/ablate_multi_version.py artifacts/native-ci/build/argocd-ls artifacts/native-ci/multi-version-ablation
    - name: Stage verified release assets
      run: python tools/release.py stage --manifest artifacts/native-ci/build/manifest.json --output artifacts/native-ci/release-assets --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}"
    - name: Retain per-platform release assets
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: argocd-release-${{ matrix.bundle }}
        path: artifacts/native-ci/release-assets/
        if-no-files-found: error
        retention-days: 30
    - name: Retain successful and failed native evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: argocd-native-${{ matrix.artifact }}
        path: artifacts/native-ci/
        if-no-files-found: error
        retention-days: 30
  candidate:
    name: Verify complete native distribution
    needs:
    - prepare
    - native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Download native assets from this exact workflow run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: argocd-release-*
        path: artifacts/candidate-inputs/native
    - name: Verify all native platforms, original licenses, source identity and checksums
      run: python tools/release.py collect --inputs artifacts/candidate-inputs/native --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}" --output artifacts/native-distribution
    - name: Retain the complete verified native distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: argocd-native-distribution-${{ needs.prepare.outputs.version }}-${{ github.sha }}
        path: artifacts/native-distribution/
        if-no-files-found: error
        retention-days: 30
    - name: Summarize the native acceptance boundary
      run: 'cat >> "$GITHUB_STEP_SUMMARY" <<''EOF''

        ## Native LSP distribution verified


        Five native hosts executed CLI/LSP consumers and verified the exact source identity,

        original licenses, packaged bytes and SHA-256 inventories.

        The Zed adapter has its own workflow and release lifecycle.

        EOF'
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
  workflow_call:
    inputs:
      release_version:
        description: Exact independent LSP version (including alpha releases)
        type: string
        required: false
        default: ''
