name: Native candidate build and behavior
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Stable server version for a clean tagged release build
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
            bundle: linux-amd64
            cc: gcc-13
            compiler: '13.3.0'
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
            bundle: linux-arm64
            cc: gcc-13
            compiler: '13.3.0'
          - runner: macos-15-intel
            platform: darwin/amd64
            artifact: macos-amd64
            bundle: darwin-amd64
            cc: clang
            compiler: 'Apple clang version 17.0.0'
          - runner: macos-15
            platform: darwin/arm64
            artifact: macos-arm64
            bundle: darwin-arm64
            cc: clang
            compiler: 'Apple clang version 17.0.0'
          - runner: windows-2025
            platform: windows/amd64
            artifact: windows-amd64
            bundle: windows-amd64
            cc: gcc
            compiler: '15.2.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Build, package and execute actual native consumers
        run: python tests/native_ci.py --platform "${{ matrix.platform }}" --source-commit "${{ github.sha }}" --compiler-version "${{ matrix.compiler }}" --release-version "${{ inputs.release_version }}"
      - name: Prepare pinned Rust adapter toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip2
      - name: Test the production installer and offline recovery
        run: cargo test --locked
      - name: Build and verify the development bundle
        run: python tests/dev_bundle_e2e.py --manifest artifacts/native-ci/build/manifest.json --output artifacts/native-ci/dev-bundle-e2e
      - name: Produce installable development bundle
        run: python tools/dev_bundle.py --manifest artifacts/native-ci/build/manifest.json --platform "${{ matrix.platform }}" --output artifacts/native-ci/dev-bundle
      - name: Build the actual adapter without native payload
        run: cargo build --locked --release --target wasm32-wasip2 --manifest-path artifacts/native-ci/dev-bundle/zed-argocd-dev-${{ matrix.bundle }}/extension/Cargo.toml
      - name: Test release staging and complete-platform aggregation
        run: python tests/release_e2e.py --platform "${{ matrix.platform }}" --output artifacts/native-ci/release-e2e
      - name: Stage verified release assets
        if: ${{ inputs.release_version != '' }}
        run: python tools/release.py stage --manifest artifacts/native-ci/build/manifest.json --output artifacts/native-ci/release-assets --version "${{ inputs.release_version }}" --source-commit "${{ github.sha }}"
      - name: Retain per-platform release assets
        if: ${{ inputs.release_version != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argocd-release-${{ matrix.bundle }}
          path: artifacts/native-ci/release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Retain successful and failed native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argocd-native-${{ matrix.artifact }}
          path: artifacts/native-ci/
          if-no-files-found: error
          retention-days: 30
