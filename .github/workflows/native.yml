name: Native LSP acceptance and distribution
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Resolve exact candidate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Validate the independent LSP VERSION and clean source
      id: version
      env:
        REQUESTED_VERSION: ${{ inputs.release_version }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: python tools/release.py version --source-commit "$SOURCE_COMMIT" --requested-version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
  native:
    name: Native ${{ matrix.host.platform }} / ${{ matrix.suite }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        suite: [consumers, provenance, compiler-environment]
        host:
        - runner: ubuntu-24.04
          platform: linux/amd64
          artifact: linux-amd64
          bundle: linux-amd64
          cc: gcc-13
          compiler: 13.3.0
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          artifact: linux-arm64
          bundle: linux-arm64
          cc: gcc-13
          compiler: 13.3.0
        - runner: macos-15-intel
          platform: darwin/amd64
          artifact: macos-amd64
          bundle: darwin-amd64
          cc: clang
          compiler: Apple clang version 17.0.0
        - runner: macos-15
          platform: darwin/arm64
          artifact: macos-arm64
          bundle: darwin-arm64
          cc: clang
          compiler: Apple clang version 17.0.0
        - runner: windows-2025
          platform: windows/amd64
          artifact: windows-amd64
          bundle: windows-amd64
          cc: gcc
          compiler: 15.2.0
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: ${{ matrix.host.platform == 'windows/amd64' && 45 || 30 }}
    env:
      CC: ${{ matrix.host.cc }}
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Execute the complete native lane with fresh build caches
      run: python tests/native_ci.py --suite "${{ matrix.suite }}" --platform "${{ matrix.host.platform }}" --source-commit "${{ github.sha }}" --compiler-version "${{ matrix.host.compiler }}" --release-version "${{ needs.prepare.outputs.version }}"
    - name: Check every schema constraint and automatic query field
      if: matrix.suite == 'consumers' && matrix.host.platform == 'linux/amd64'
      shell: bash
      run: |
        set -o pipefail
        go test -mod=vendor -count=1 -v ./internal/assets ./internal/analysis 2>&1 | tee artifacts/native-ci/go-tests.log
    - name: Check concurrent index and overlay delivery
      if: matrix.suite == 'consumers' && matrix.host.platform == 'linux/amd64'
      shell: bash
      run: |
        go test -mod=vendor -race -count=1 ./internal/lsp ./internal/workspace
        go build -mod=vendor -race -o artifacts/native-ci/build/argocd-ls-race ./cmd/argocd-ls
        python tests/mixed_parent_index_e2e.py artifacts/native-ci/build/argocd-ls-race artifacts/native-ci/race-mixed-parent --ordinary-files 1000
        python tests/publication_delivery_e2e.py artifacts/native-ci/build/argocd-ls-race artifacts/native-ci/race-publication-delivery
    - name: Test release staging and complete-platform aggregation
      if: matrix.suite == 'consumers'
      run: python tests/release_e2e.py --platform "${{ matrix.host.platform }}" --output artifacts/native-ci/release-e2e
    - name: Prove native release works without any editor checkout
      if: matrix.suite == 'consumers' && matrix.host.platform == 'linux/amd64'
      run: python tests/native_isolation.py --output artifacts/native-ci/native-isolation
    - name: Verify compatibility mechanisms by isolated removal
      if: matrix.suite == 'consumers' && matrix.host.platform == 'linux/amd64'
      run: python tests/ablate_multi_version.py artifacts/native-ci/build/argocd-ls artifacts/native-ci/multi-version-ablation
    - name: Stage verified release assets
      if: matrix.suite == 'consumers'
      run: python tools/release.py stage --manifest artifacts/native-ci/build/manifest.json --output artifacts/native-ci/release-assets --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}"
    - name: Retain per-platform release assets
      if: matrix.suite == 'consumers'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: argocd-release-${{ matrix.host.bundle }}
        path: artifacts/native-ci/release-assets/
        if-no-files-found: error
        retention-days: 30
    - name: Retain the independently checked lane report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: argocd-acceptance-${{ matrix.host.bundle }}-${{ matrix.suite }}
        path: artifacts/native-ci/report.json
        if-no-files-found: error
        retention-days: 30
    - name: Archive complete replay evidence without disposable compiler caches
      if: always()
      run: python tools/ci_evidence.py pack --root artifacts/native-ci --output artifacts/native-evidence
    - name: Verify archived bytes and metadata without extracting fixtures
      if: always()
      run: python tools/ci_evidence.py verify --manifest artifacts/native-evidence/manifest.json
    - name: Retain successful and failed native evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: argocd-native-${{ matrix.host.artifact }}-${{ matrix.suite }}
        path: artifacts/native-evidence/
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
  candidate:
    name: Verify complete native distribution
    if: always()
    needs:
    - prepare
    - native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Require every native lane and candidate preparation
      env:
        PREPARE_RESULT: ${{ needs.prepare.result }}
        NATIVE_RESULT: ${{ needs.native.result }}
      run: test "$PREPARE_RESULT" = success && test "$NATIVE_RESULT" = success
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Download native assets from this exact workflow run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: argocd-release-*
        path: artifacts/candidate-inputs/native
    - name: Download every lane report from this exact workflow run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: argocd-acceptance-*
        path: artifacts/candidate-inputs/acceptance
    - name: Require all fifteen native lanes and the exact tested release bytes
      run: python tools/ci_gate.py --inputs artifacts/candidate-inputs/acceptance --assets artifacts/candidate-inputs/native --source-commit "${{ github.sha }}" --version "${{ needs.prepare.outputs.version }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --jobs-result "${{ needs.native.result }}" --output artifacts/candidate-acceptance.json
    - name: Verify all native platforms, original licenses, source identity and checksums
      run: python tools/release.py collect --inputs artifacts/candidate-inputs/native --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}" --output artifacts/native-distribution
    - name: Retain the complete verified native distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: argocd-native-distribution-${{ needs.prepare.outputs.version }}-${{ github.sha }}
        path: artifacts/native-distribution/
        if-no-files-found: error
        retention-days: 30
    - name: Summarize the native acceptance boundary
      run: 'cat >> "$GITHUB_STEP_SUMMARY" <<''EOF''

        ## Native LSP distribution verified


        Five native hosts executed CLI/LSP consumers and verified the exact source identity,

        original licenses, packaged bytes and SHA-256 inventories.

        The Zed adapter has its own workflow and release lifecycle.

        EOF'
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
  workflow_call:
    inputs:
      release_version:
        description: Exact independent LSP version (including alpha releases)
        type: string
        required: false
        default: ''
