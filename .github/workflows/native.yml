name: P02 Argo CD gate diagnostics (synthetic fixtures only)
'on':
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [scenario, manual-green, cancel-upstream]
        default: manual-green
        description: Diagnostic override; never executes product tests
      target_pr:
        type: string
        default: ''
        description: Required for cancellation replacement; original PR number
permissions:
  contents: read
jobs:
  prepare:
    name: P02 fix synthetic fixture plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scenario: ${{ steps.plan.outputs.scenario }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - id: plan
      name: Invoke frozen gate planner
      env:
        P02_TARGET_PR: ${{ inputs.target_pr }}
        P02_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        P02_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python p02/harness.py prepare --mode "${{ inputs.mode || 'scenario' }}" --output p02-out
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p02-cd-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-out/
        if-no-files-found: error
  upstream:
    name: P02 synthetic upstream (no product executes)
    needs: prepare
    if: needs.prepare.outputs.scenario != 'unexpected-skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: p02-cd-upstream-${{ github.repository }}-${{ github.event.pull_request.number || inputs.target_pr || github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: p02-cd-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-out
    - name: Create explicit positive fixture with real plan/start/receipt CLI
      run: python p02/harness.py fixtures --output p02-out
    - name: Retain fixture before intentional failure or cancellation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p02-cd-fixture-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-out/
        if-no-files-found: error
    - name: Wait for actual upstream job cancellation
      if: needs.prepare.outputs.scenario == 'upstream-cancel'
      run: python p02/harness.py wait-cancel --output p02-out
    - name: Apply intentional upstream failure after artifact retention
      run: python p02/harness.py finish --output p02-out
  acceptance:
    name: ${{ github.event_name == 'pull_request' && 'Verify complete native distribution' || 'Native distribution evidence' }}
    if: always()
    needs: [prepare, upstream]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: p02-cd-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-gate-input
    - name: Retrieve upstream evidence when it exists
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: p02-cd-fixture-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-gate-input
    - name: Run genuine frozen gate and preserve its actual exit
      env:
        P02_NEEDS_JSON: ${{ toJSON(needs) }}
      run: python p02/harness.py native --output p02-gate-input
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p02-cd-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-gate-input/
        if-no-files-found: error

  adapter_acceptance:
    name: ${{ github.event_name == 'pull_request' && 'Zed acceptance gate' || 'Zed adapter evidence' }}
    if: always()
    needs: [prepare, upstream]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: p02-cd-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-gate-input
    - name: Retrieve upstream evidence when it exists
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: p02-cd-fixture-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-gate-input
    - name: Run genuine frozen gate and preserve its actual exit
      env:
        P02_NEEDS_JSON: ${{ toJSON(needs) }}
      run: python p02/harness.py zed --output p02-gate-input
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p02-cd-adapter-${{ github.run_id }}-${{ github.run_attempt }}
        path: p02-gate-input/
        if-no-files-found: error
