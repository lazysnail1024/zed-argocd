name: Release independent native LSP
'on':
  push:
    tags:
    - v*
    branches:
    - main
    paths:
    - VERSION
    - .github/workflows/release.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: native-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Resolve the exact clean LSP version and release tag
      id: version
      env:
        RELEASE_REF: ${{ github.ref }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        resolved=$(python tools/release.py version --source-commit "$RELEASE_COMMIT")
        tag="v${resolved#version=}"
        case "$RELEASE_REF" in
          refs/heads/main|"refs/tags/$tag") ;;
          *) echo 'Release must run on main or its exact version tag.' >&2; exit 1 ;;
        esac
        printf '%s\n' "$resolved" "tag=$tag" >> "$GITHUB_OUTPUT"
  native:
    needs: version
    uses: ./.github/workflows/native.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
  publish:
    needs:
    - version
    - native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: argocd-release-*
        path: artifacts/release-inputs
    - name: Recheck all five platforms and generate SHA256SUMS
      env:
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: python tools/release.py collect --inputs artifacts/release-inputs --output artifacts/release --version "$RELEASE_VERSION"
        --source-commit "$RELEASE_COMMIT"
    - name: Create the exact tag and publish an immutable native release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_API_URL: ${{ github.api_url }}
        RELEASE_COMMIT: ${{ github.sha }}
        RELEASE_TAG: ${{ needs.version.outputs.tag }}
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
      run: |
        python - <<'PY_TAG'
        import json, os, re, urllib.error, urllib.parse, urllib.request

        commit = os.environ['RELEASE_COMMIT']
        tag = os.environ['RELEASE_TAG']
        if not re.fullmatch('[0-9a-f]{40}', commit):
            raise SystemExit('Release requires an exact commit SHA')
        base = os.environ['RELEASE_API_URL'] + '/repos/' + os.environ['GH_REPO']
        headers = {'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                   'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                   'X-GitHub-Api-Version': '2022-11-28'}

        def api(path, payload=None, absent_ok=False):
            data = None if payload is None else json.dumps(payload).encode()
            request = urllib.request.Request(base + path, data=data, headers=headers,
                                             method='GET' if payload is None else 'POST')
            try:
                with urllib.request.urlopen(request, timeout=60) as response:
                    return json.load(response)
            except urllib.error.HTTPError as error:
                if payload is None and absent_ok and error.code == 404:
                    return None
                raise SystemExit(f'GitHub {request.get_method()} {path} failed: HTTP {error.code}') from None

        # Listing with contents:write also includes drafts; never replace either kind.
        page = 1
        while True:
            releases = api(f'/releases?per_page=100&page={page}')
            if any(release['tag_name'] == tag for release in releases):
                raise SystemExit('This release already exists, including any draft; published pins must not be overwritten')
            if len(releases) < 100:
                break
            page += 1

        path = '/git/ref/tags/' + urllib.parse.quote(tag, safe='')
        if api(path, absent_ok=True) is None:
            api('/git/refs', {'ref': 'refs/tags/' + tag, 'sha': commit})
        reference = api(path)
        if reference['ref'] != 'refs/tags/' + tag:
            raise SystemExit('GitHub returned a different tag reference')
        obj = reference['object']
        for _ in range(16):
            if obj['type'] != 'tag':
                break
            obj = api('/git/tags/' + obj['sha'])['object']
        if obj['type'] != 'commit' or obj['sha'] != commit:
            raise SystemExit('Existing tag does not resolve to this exact verified commit')
        print(f'Verified {tag} at {commit}; existing tags were not modified')
        PY_TAG
        flags=()
        if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
        gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --target "$RELEASE_COMMIT" --draft "${flags[@]}" --title "Argo CD LSP $RELEASE_VERSION" --notes-file docs/native-release-notes.md
        gh release edit "$RELEASE_TAG" --draft=false
