id = "argocd-lsp"
name = "Argo CD Language Server"
version = "0.1.0"
schema_version = 1
snippets = ["snippets/yaml.json"]
authors = ["snail (lazysnail1024)"]
repository = "https://github.com/lazysnail1024/zed-argocd"
description = "Argo CD YAML diagnostics, completion and navigation with a verified native language server."

[language_servers.argocd-ls]
name = "Argo CD Language Server"
languages = ["YAML"]

[language_servers.argocd-ls.language_ids]
YAML = "yaml"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["version", "--json"]

# Managed native assets and SHA256SUMS use the same narrowly scoped release path.
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["lazysnail1024", "zed-argocd", "releases", "download", "**"]
